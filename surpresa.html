<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surpresa 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .box {
      max-width: 600px;
      padding: 20px;
    }

    .heart {
      font-size: 60px;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: 40px;
    }

    p {
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="heart">❤️</div>

    <h1>Surpresa 💖</h1>

    <p>
      Se você chegou até aqui, significa que você é muito importante pra mim.
    </p>

    <p>
      Eu te amo mais do que consigo explicar.
    </p>

    <p>
      E isso aqui é só o começo.
    </p>
  </div>

</body>
</html>
